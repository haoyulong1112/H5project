<html>

    <meta name="description" content="" id="js-p-share-description">
    <meta name="shareimg" content="" id="js-p-share-img">
    <meta name="shareurl" content="" id="js-p-share-url">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="screen-orientation" content="portrait"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">

    <meta name="full-screen" content="yes">
    <meta name="x5-fullscreen" content="true">
	  <link rel="shortcut icon" type="image/x-icon" href="../../../static/images/icons/favicon.ico" media="screen" />
    <link rel="icon" href="" size="16x16 32x32">
  </head>
  <body>
    <div id="app"></div>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        var timestamp = new Date().getTime().toString()
        timestamp = timestamp.substr(0, timestamp.length - 5)
        document.write('<script src="../../../static/config/index.js?t='+timestamp+'"><\/script>')
    </script>
    <script>
      // 强制禁止用户修改微信客户端的字体大小
      (function() {
          if (typeof WeixinJSBridge == "object" && typeof WeixinJSBridge.invoke == "function") {
              handleFontSize();
          } else {
              if (document.addEventListener) {
                  document.addEventListener("WeixinJSBridgeReady", handleFontSize, false);
              } else if (document.attachEvent) {
                  document.attachEvent("WeixinJSBridgeReady", handleFontSize);
                  document.attachEvent("onWeixinJSBridgeReady", handleFontSize);  }
          }
          function handleFontSize() {
              // 设置网页字体为默认大小
              WeixinJSBridge.invoke('setFontSizeCallback', { 'fontSize' : 0 });
              // 重写设置网页字体大小的事件
              WeixinJSBridge.on('menu:setfont', function() {
                  WeixinJSBridge.invoke('setFontSizeCallback', { 'fontSize' : 0 });
              });
          }
      })();
    </script>
    <script>
        if (config.vconsole) {
            document.write('<script src="https://res.wx.qq.com/mmbizwap/zh_CN/htmledition/js/vconsole/3.0.0/vconsole.min.js"><\/script><script>new VConsole();console.log(location.href)<\/script>')
        }
    </script>
  </body>
